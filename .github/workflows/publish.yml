name: Publish npm package

on:
  release:
    types:
      - published

concurrency:
  group: npm-publish-${{ github.event.release.tag_name }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # ==============================================================
  # 1. VALIDATE RELEASE
  # ==============================================================

  validate:
    name: 1 · Validate Release
    runs-on: ubuntu-latest

    outputs:
      name: ${{ steps.release.outputs.name }}
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      channel: ${{ steps.release.outputs.channel }}

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.release.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate release
        id: release
        shell: bash
        env:
          TAG: ${{ github.event.release.tag_name }}
          IS_PRERELEASE: ${{ github.event.release.prerelease }}
        run: |
          set -euo pipefail

          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")
          EXPECTED_TAG="v$VERSION"

          echo "======================================"
          echo "RELEASE VALIDATION"
          echo "======================================"
          echo "Package:         $NAME"
          echo "Package version: $VERSION"
          echo "Git tag:         $TAG"
          echo "Pre-release:     $IS_PRERELEASE"
          echo "======================================"

          if [[ "$TAG" != "$EXPECTED_TAG" ]]; then
            echo "::error::Git tag does not match package.json version."
            echo "::error::Tag:      $TAG"
            echo "::error::Expected: $EXPECTED_TAG"
            exit 1
          fi

          if [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+-beta\.[0-9]+$ ]]; then
            CHANNEL="beta"

            if [[ "$IS_PRERELEASE" != "true" ]]; then
              echo "::error::Beta versions must be published as GitHub pre-releases."
              exit 1
            fi

          elif [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            CHANNEL="latest"

            if [[ "$IS_PRERELEASE" == "true" ]]; then
              echo "::error::Stable versions must not be marked as pre-release."
              exit 1
            fi

          else
            echo "::error::Unsupported version format: $VERSION"
            echo "::error::Expected X.Y.Z or X.Y.Z-beta.N"
            exit 1
          fi

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"

          echo "Release validated: $NAME@$VERSION → $CHANNEL"

  # ==============================================================
  # 2. BUILD + TEST
  # ==============================================================

  build-test:
    name: 2 · Build & Test
    needs: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@11.19.1

      - name: Install dependencies
        run: npm ci

      - name: Clean dist
        run: rm -rf dist

      - name: Build package
        run: npm run build

      - name: Run TypeScript tests
        run: npm run test:types

      - name: Run regression tests
        run: node test.js

      - name: Verify required dist files
        shell: bash
        run: |
          set -euo pipefail

          REQUIRED_FILES=(
            "dist/index.js"
            "dist/index.d.ts"
            "dist/express.js"
            "dist/express.d.ts"
            "dist/fastify.js"
            "dist/fastify.d.ts"
          )

          for FILE in "${REQUIRED_FILES[@]}"; do
            if [[ ! -f "$FILE" ]]; then
              echo "::error::Required build output missing: $FILE"
              exit 1
            fi
          done

      - name: Upload tested dist
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist/
          if-no-files-found: error
          retention-days: 1

  # ==============================================================
  # 3. VERIFY PACKAGE
  # ==============================================================

  verify-package:
    name: 3 · Verify Package
    needs:
      - validate
      - build-test

    runs-on: ubuntu-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@11.19.1

      - name: Download tested dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: Show package files
        run: find dist -maxdepth 2 -type f -print

      - name: Verify npm package
        run: npm pack --dry-run

  # ==============================================================
  # 4. CHECK REGISTRY
  # ==============================================================

  registry-check:
    name: 4 · Check Registry
    needs:
      - validate
      - verify-package

    runs-on: ubuntu-latest

    outputs:
      already_published: ${{ steps.check.outputs.already_published }}

    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Check npm version
        id: check
        shell: bash
        env:
          NAME: ${{ needs.validate.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "::error::$NAME@$VERSION is already published."
            echo "already_published=true" >> "$GITHUB_OUTPUT"
            exit 1
          fi

          echo "$NAME@$VERSION is available."
          echo "already_published=false" >> "$GITHUB_OUTPUT"

  # ==============================================================
  # 5. PUBLISH
  # ==============================================================

  publish:
    name: 5 · Publish npm
    needs:
      - validate
      - build-test
      - registry-check

    runs-on: ubuntu-latest

    environment:
      name: perfect-payload-publisher

    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.validate.outputs.tag }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@11.19.1

      - name: Download tested dist
        uses: actions/download-artifact@v4
        with:
          name: dist-${{ needs.validate.outputs.version }}
          path: dist

      - name: Publish beta
        if: needs.validate.outputs.channel == 'beta'
        run: npm publish --tag beta --provenance

      - name: Publish stable
        if: needs.validate.outputs.channel == 'latest'
        run: npm publish --provenance

  # ==============================================================
  # 6. VERIFY PUBLISH
  # ==============================================================

  verify-publish:
    name: 6 · Verify Publish
    needs:
      - validate
      - publish

    runs-on: ubuntu-latest

    steps:
      - name: Setup Node.js
        # registry-url removed to avoid overriding OIDC configurations
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Verify version
        shell: bash
        env:
          NAME: ${{ needs.validate.outputs.name }}
          VERSION: ${{ needs.validate.outputs.version }}
          CHANNEL: ${{ needs.validate.outputs.channel }}
        run: |
          set -euo pipefail

          FOUND=""

          for ATTEMPT in 1 2 3 4 5 6; do
            FOUND=$(npm view "$NAME@$VERSION" version 2>/dev/null || true)

            if [[ "$FOUND" == "$VERSION" ]]; then
              break
            fi

            echo "Waiting for npm registry... attempt $ATTEMPT"
            sleep 120
          done

          if [[ "$FOUND" != "$VERSION" ]]; then
            echo "::error::$NAME@$VERSION is not visible on npm."
            exit 1
          fi

          DIST_TAG=$(npm view "$NAME" "dist-tags.$CHANNEL" 2>/dev/null || true)

          if [[ "$DIST_TAG" != "$VERSION" ]]; then
            echo "::error::$CHANNEL points to $DIST_TAG instead of $VERSION"
            exit 1
          fi

          echo "======================================"
          echo "PUBLISH VERIFIED"
          echo "======================================"
          echo "$NAME@$VERSION"
          echo "$CHANNEL → $VERSION"
          echo "======================================"

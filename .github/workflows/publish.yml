name: Stage npm package

on:
  push:
    branches:
      - "**"

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 2

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Setup npm
        run: npm install --global npm@11.19.1

      - name: Verify Node and npm versions
        run: |
          node -v
          npm -v

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test -- --passWithNoTests

      - name: Get package information
        id: package
        shell: bash
        run: |
          NAME=$(node -p "require('./package.json').name")
          VERSION=$(node -p "require('./package.json').version")

          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          echo "Package: $NAME"
          echo "Version: $VERSION"
          echo "Branch:  $GITHUB_REF_NAME"

      # -------------------------------------------------------
      # MAIN BRANCH
      # Must contain a production version.
      # Example: 1.3.0
      # -------------------------------------------------------
      - name: Validate production version
        if: github.ref_name == 'main'
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"

          if [[ "$VERSION" == *"-beta"* ]]; then
            echo "::error::main branch cannot publish a beta version ($VERSION)."
            exit 1
          fi

          echo "Valid production version detected: $VERSION"

      # -------------------------------------------------------
      # NON-MAIN BRANCH
      # Must contain a beta version.
      # Example: 1.3.0-beta.0
      # -------------------------------------------------------
      - name: Validate beta version
        if: github.ref_name != 'main'
        shell: bash
        run: |
          VERSION="${{ steps.package.outputs.version }}"

          if [[ "$VERSION" != *"-beta"* ]]; then
            echo "::error::Non-main branches can only publish beta versions."
            echo "::error::Current version is $VERSION."
            echo "::error::Expected a version such as 1.3.0-beta.0."
            exit 1
          fi

          echo "Valid beta version detected: $VERSION"

      # -------------------------------------------------------
      # CHECK NPM
      # Determines whether this exact version is already live.
      # -------------------------------------------------------
      - name: Check whether version is already published
        id: published
        shell: bash
        run: |
          NAME="${{ steps.package.outputs.name }}"
          VERSION="${{ steps.package.outputs.version }}"

          echo "Checking npm for $NAME@$VERSION..."

          if npm view "$NAME@$VERSION" version >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION is already published."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
            echo "$NAME@$VERSION has not been published."
          fi

      # -------------------------------------------------------
      # FAIL IF VERSION ALREADY EXISTS
      # npm versions are immutable, so require a new version.
      # -------------------------------------------------------
      - name: Fail if version is already published
        if: steps.published.outputs.exists == 'true'
        shell: bash
        run: |
          echo "::error::${{ steps.package.outputs.name }}@${{ steps.package.outputs.version }} is already published."
          echo "::error::Update package.json to a new version before publishing."
          exit 1

      # -------------------------------------------------------
      # BETA RELEASE
      # Any branch except main + unpublished beta version.
      # -------------------------------------------------------
      - name: Stage beta release
        if: >
          github.ref_name != 'main' &&
          steps.published.outputs.exists == 'false'
        shell: bash
        run: |
          echo "Branch: $GITHUB_REF_NAME"
          echo "Staging beta ${{ steps.package.outputs.version }}"
          npm stage publish --tag beta

      # -------------------------------------------------------
      # PRODUCTION RELEASE
      # main + unpublished non-beta version.
      # -------------------------------------------------------
      - name: Stage production release
        if: >
          github.ref_name == 'main' &&
          steps.published.outputs.exists == 'false'
        shell: bash
        run: |
          echo "Branch: main"
          echo "Staging production ${{ steps.package.outputs.version }}"
          npm stage publish
